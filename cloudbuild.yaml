# Google Cloud Build configuration for automated deployment
# This file automates the build and deployment process to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:latest'
      - '.'
    timeout: '1800s'  # 30 minutes for large image

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vibevoice-tts'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$COMMIT_SHA'
      - '--region'
      - 'us-central1'  # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Change to --no-allow-unauthenticated for private access
      - '--memory'
      - '8Gi'  # 8GB RAM - adjust based on needs
      - '--cpu'
      - '4'  # 4 vCPUs - adjust based on needs
      - '--timeout'
      - '300'  # 5 minutes timeout
      - '--max-instances'
      - '10'  # Max scaling instances
      - '--min-instances'
      - '0'  # Min instances (0 = scale to zero)
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'HOST=0.0.0.0,PORT=8080,DEVICE=cpu,MODEL_PATH=microsoft/VibeVoice-Realtime-0.5B,DEFAULT_VOICE=en-Carter_man,INFERENCE_STEPS=5,CFG_SCALE=1.5'

# Timeout for entire build
timeout: '2400s'  # 40 minutes

# Images to push to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/vibevoice-tts:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vibevoice-tts:latest'

# Options
options:
  machineType: 'E2_HIGHCPU_8'  # Use a powerful machine for building
  logging: CLOUD_LOGGING_ONLY
