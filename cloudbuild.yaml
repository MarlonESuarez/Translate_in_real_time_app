# Google Cloud Build configuration for automated deployment
# This file automates the build and deployment process to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:latest'
      - '.'
    timeout: '1800s'  # 30 minutes for large image

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$BUILD_ID'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vibevoice-tts'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vibevoice-tts:$BUILD_ID'
      - '--region'
      - 'us-central1'  # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Change to --no-allow-unauthenticated for private access
      - '--memory'
      - '4Gi'  # 4GB RAM - reduced for cost optimization
      - '--cpu'
      - '2'  # 2 vCPUs - reduced for cost optimization (was 4)
      - '--timeout'
      - '900'  # 15 minutes timeout for requests
      - '--startup-probe'
      - 'httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=30,timeoutSeconds=10,periodSeconds=10,failureThreshold=30'
      - '--max-instances'
      - '10'  # Max scaling instances
      - '--min-instances'
      - '0'  # Min instances (0 = scale to zero)
      - '--no-cpu-throttling'  # Don't throttle CPU during startup
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'HOST=0.0.0.0,DEVICE=cpu,MODEL_PATH=microsoft/VibeVoice-Realtime-0.5B,DEFAULT_VOICE=en-Carter_man,INFERENCE_STEPS=5,CFG_SCALE=1.5,GOOGLE_CLOUD_PROJECT_ID=mytranslatevoice'
      - '--set-secrets'
      - 'HF_TOKEN=HF_TOKEN:latest'

# Timeout for entire build
timeout: '2400s'  # 40 minutes

# Images to push to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/vibevoice-tts:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/vibevoice-tts:latest'

# Options
options:
  machineType: 'E2_HIGHCPU_8'  # Use a powerful machine for building
  logging: CLOUD_LOGGING_ONLY
